<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recomposición Tracker</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone CDN para compilar JSX en el navegador -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // --- ICONOS SVG ---
    const IconDumbbell = () => (
      <svg className="w-5 h-5 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 6h12M6 18h12M4 9h2v6H4zm14 0h2v6h-2zM9 4v16m6-16v16" />
      </svg>
    );
    const IconCalendar = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
      </svg>
    );
    const IconTrophy = () => (
      <svg className="w-5 h-5 inline-block text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
      </svg>
    );
    const IconTrash = () => (
      <svg className="w-4 h-4 inline-block" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    // --- DATOS DE RUTINAS ---
    const rutinasData = {
      dia1: {
        nombre: "Día 1: Fuerza y Empuje",
        ejercicios: [
          { id: "g_sq", nombre: "Sentadilla Goblet", peso: "15.5 kg", series: "4", reps: "10-12", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80", guia: "Pega la mancuerna al pecho, desciende profundo manteniendo la espalda recta.", benef: "Cuádriceps y glúteos fuertes." },
          { id: "fl_pr", nombre: "Floor Press con Mancuernas", peso: "11.5 - 15.5 kg c/u", series: "4", reps: "8-10", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&q=80", guia: "Acostado en el suelo, empuja verticalmente sin rebotar los codos.", benef: "Desarrollo de pecho y tríceps protegiendo hombros." },
          { id: "db_row", nombre: "Remo Inclinado Bilateral", peso: "11.5 kg c/u", series: "4", reps: "10-12", img: "https://images.unsplash.com/photo-1603287681836-b174ce5074c2?w=500&q=80", guia: "Inclina el torso a 45°, tira hacia la cadera juntando escápulas.", benef: "Grosor de espalda y postura." },
          { id: "lunge", nombre: "Zancadas Estáticas", peso: "5.5 - 11.5 kg c/u", series: "3", reps: "10/pierna", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&q=80", guia: "Baja la rodilla trasera cerca del suelo manteniendo el torso firme.", benef: "Fuerza unilateral y estabilidad para fútbol." },
          { id: "ohp", nombre: "Press Militar Sentado", peso: "5.5 - 11.5 kg c/u", series: "3", reps: "10-12", img: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=500&q=80", guia: "Empuja sobre la cabeza sin arquear la espalda baja.", benef: "Deltoides completos." },
          { id: "curl", nombre: "Curl de Bíceps Alterno", peso: "5.5 kg c/u", series: "3", reps: "12-15", img: "https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?w=500&q=80", guia: "Sube controlando la bajada en 3 segundos sin balanceo.", benef: "Fuerza en brazos." }
        ]
      },
      dia2: {
        nombre: "Día 2: Cadena Posterior y Tracción",
        ejercicios: [
          { id: "rdl", nombre: "Peso Muerto Rumano", peso: "11.5 - 15.5 kg c/u", series: "4", reps: "10-12", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80", guia: "Empuja la cadera hacia atrás con leve flexión de rodilla.", benef: "Isquiotibiales y glúteos potentes." },
          { id: "pushup", nombre: "Flexiones / Push-ups", peso: "Peso corporal", series: "4", reps: "10-15", img: "https://images.unsplash.com/photo-1598971639058-fab3c3109a00?w=500&q=80", guia: "Cuerpo en línea recta, baja el pecho hasta rozar el suelo.", benef: "Pectoral, tríceps y core." },
          { id: "one_row", nombre: "Remo Unilateral con Apoyo", peso: "15.5 kg (1 pesa)", series: "4", reps: "10-12/lado", img: "https://images.unsplash.com/photo-1603287681836-b174ce5074c2?w=500&q=80", guia: "Apoya una mano en la silla y jala hacia el bolsillo.", benef: "Dorsal ancho y aislamiento." },
          { id: "glute_br", nombre: "Puente de Glúteos con Pesa", peso: "15.5 kg", series: "3", reps: "12-15", img: "https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500&q=80", guia: "Pesa en cadera, eleva y aprieta glúteos 2 segundos arriba.", benef: "Potencia de cadera para sprints." },
          { id: "lat_raise", nombre: "Elevaciones Laterales", peso: "5.5 kg c/u", series: "4", reps: "12-15", img: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=500&q=80", guia: "Eleva hasta la altura de los hombros con codos semi flexionados.", benef: "Amplitud de hombros." },
          { id: "tricep", nombre: "Extensión Tríceps Copa", peso: "11.5 kg (1 pesa)", series: "3", reps: "12-15", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&q=80", guia: "Sostén con ambas manos tras nuca y extiende arriba.", benef: "Cabeza larga del tríceps." }
        ]
      },
      dia3: {
        nombre: "Día 3: Pierna Unilateral y Densidad",
        ejercicios: [
          { id: "bulgarian", nombre: "Sentadilla Búlgara", peso: "5.5 - 11.5 kg c/u", series: "3", reps: "8-10/pierna", img: "https://images.unsplash.com/photo-1534438327276-14e5300c3a48?w=500&q=80", guia: "Pie trasero elevado en silla, desciende vertical con control.", benef: "Máximo estímulo de hipertrofia en piernas." },
          { id: "neutral_press", nombre: "Floor Press Neutro", peso: "11.5 - 15.5 kg c/u", series: "4", reps: "10-12", img: "https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?w=500&q=80", guia: "Palmas mirándose entre sí durante todo el recorrido.", benef: "Énfasis en tríceps y porción clavicular." },
          { id: "upright_row", nombre: "Remo al Mentón / Alto", peso: "5.5 - 11.5 kg c/u", series: "3", reps: "10-12", img: "https://images.unsplash.com/photo-1603287681836-b174ce5074c2?w=500&q=80", guia: "Sube guiando con los codos hasta la altura del pecho.", benef: "Trapecios y deltoides." },
          { id: "rear_delt", nombre: "Pájaros / Deltoides Posterior", peso: "5.5 kg c/u", series: "3", reps: "12-15", img: "https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?w=500&q=80", guia: "Torso inclinado, abre los brazos en cruz enfocando espalda alta.", benef: "Salud articular del hombro." },
          { id: "calves", nombre: "Elevación de Talones", peso: "11.5 - 15.5 kg", series: "4", reps: "15-20", img: "https://images.unsplash.com/photo-1517838277536-f5f99be501cd?w=500&q=80", guia: "Pausa de 2 segundos arriba en máxima contracción.", benef: "Gemelos resistentes para fútbol." },
          { id: "plank", nombre: "Plancha Abdominal", peso: "Peso corporal", series: "3", reps: "45-60 seg", img: "https://images.unsplash.com/photo-1598971639058-fab3c3109a00?w=500&q=80", guia: "Abdomen contraído, cuerpo recto como una tabla.", benef: "Core blindado y soporte lumbar." }
        ]
      }
    };

    function App() {
      const [activeTab, setActiveTab] = useState("tracker");
      const [fecha, setFecha] = useState(() => {
        const today = new Date();
        return today.toISOString().split("T")[0];
      });
      const [tipoDia, setTipoDia] = useState("fuerza");
      const [rutinaFuerza, setRutinaFuerza] = useState("dia1");
      const [checks, setChecks] = useState({});
      const [ejerciciosProg, setEjerciciosProg] = useState({});
      const [detallesAbiertos, setDetallesAbiertos] = useState({});
      const [historial, setHistorial] = useState(() => {
        const saved = localStorage.getItem("recomp_historial");
        return saved ? JSON.parse(saved) : [];
      });
      const [filtroTipo, setFiltroTipo] = useState("todos");
      const [filtroFecha, setFiltroFecha] = useState("");
      const [mensajeGuardado, setMensajeGuardado] = useState(false);

      // Guardar en localStorage
      useEffect(() => {
        localStorage.setItem("recomp_historial", JSON.stringify(historial));
      }, [historial]);

      const handleCheck = (id) => {
        setChecks(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const handleProgresoChange = (id, campo, valor) => {
        setEjerciciosProg(prev => ({
          ...prev,
          [id]: { ...prev[id], [campo]: valor }
        }));
      };

      const toggleDetalle = (id) => {
        setDetallesAbiertos(prev => ({ ...prev, [id]: !prev[id] }));
      };

      const formatearFecha = (isoStr) => {
        if (!isoStr) return "";
        const [y, m, d] = isoStr.split("-");
        return `${d}-${m}-${y.slice(-2)}`;
      };

      const handleGuardar = () => {
        const nuevoRegistro = {
          id: Date.now(),
          fecha,
          fechaFormateada: formatearFecha(fecha),
          tipoDia,
          rutinaFuerza: tipoDia === "fuerza" ? rutinaFuerza : null,
          checks,
          ejerciciosProg: tipoDia === "fuerza" ? ejerciciosProg : null
        };
        setHistorial([nuevoRegistro, ...historial]);
        setMensajeGuardado(true);
        setTimeout(() => setMensajeGuardado(false), 3000);
      };

      const eliminarRegistro = (id) => {
        setHistorial(historial.filter(h => h.id !== id));
      };

      const historialFiltrado = historial.filter(item => {
        const matchTipo = filtroTipo === "todos" || item.tipoDia === filtroTipo;
        const matchFecha = !filtroFecha || item.fecha === filtroFecha;
        return matchTipo && matchFecha;
      });

      return (
        <div className="max-w-2xl mx-auto p-4 pb-20">
          {/* Header */}
          <div className="bg-slate-800 border border-slate-700 rounded-2xl p-5 mb-6 shadow-xl text-center">
            <h1 className="text-2xl font-black text-emerald-400 tracking-wide">RECOMPOSICIÓN CORPORAL</h1>
            <p className="text-xs text-slate-400 mt-1">Plan Personalizado • Déficit Gradual • Ayuno 15/9</p>
          </div>

          {/* Navegación Tabs */}
          <div className="flex bg-slate-800/80 p-1.5 rounded-xl mb-6 border border-slate-700">
            <button
              onClick={() => setActiveTab("tracker")}
              className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${activeTab === 'tracker' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
            >
              Registro Diario
            </button>
            <button
              onClick={() => setActiveTab("historial")}
              className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${activeTab === 'historial' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
            >
              Historial ({historial.length})
            </button>
            <button
              onClick={() => setActiveTab("guia")}
              className={`flex-1 py-2.5 rounded-lg text-sm font-bold transition-all ${activeTab === 'guia' ? 'bg-emerald-500 text-slate-950 shadow-md' : 'text-slate-400 hover:text-white'}`}
            >
              Guía
            </button>
          </div>

          {/* --- TAB TRACKER --- */}
          {activeTab === "tracker" && (
            <div className="space-y-5">
              {/* Selector Fecha y Tipo */}
              <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-4">
                <div className="flex justify-between items-center">
                  <label className="text-sm font-semibold text-slate-300 flex items-center gap-2">
                    <IconCalendar /> Fecha:
                  </label>
                  <div className="flex items-center gap-2">
                    <input
                      type="date"
                      value={fecha}
                      onChange={(e) => setFecha(e.target.value)}
                      className="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-emerald-400 focus:outline-none focus:border-emerald-500"
                    />
                    <span className="text-xs bg-slate-900 px-2 py-1.5 rounded-lg font-mono border border-slate-700 text-slate-300">
                      {formatearFecha(fecha)}
                    </span>
                  </div>
                </div>

                <div>
                  <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Tipo de Actividad</label>
                  <div className="grid grid-cols-3 gap-2">
                    {[
                      { id: "fuerza", label: "🏋️ Fuerza" },
                      { id: "futbol", label: "⚽ Fútbol" },
                      { id: "descanso", label: "💤 Descanso" }
                    ].map(t => (
                      <button
                        key={t.id}
                        onClick={() => setTipoDia(t.id)}
                        className={`py-2 rounded-lg text-sm font-bold border transition-all ${tipoDia === t.id ? 'bg-emerald-500/20 border-emerald-500 text-emerald-300' : 'bg-slate-900/60 border-slate-700 text-slate-400'}`}
                      >
                        {t.label}
                      </button>
                    ))}
                  </div>
                </div>

                {tipoDia === "fuerza" && (
                  <div>
                    <label className="text-xs font-semibold text-slate-400 uppercase tracking-wider block mb-2">Seleccionar Rutina</label>
                    <select
                      value={rutinaFuerza}
                      onChange={(e) => setRutinaFuerza(e.target.value)}
                      className="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-slate-200 focus:border-emerald-500 focus:outline-none"
                    >
                      <option value="dia1">Día 1: Fuerza y Empuje</option>
                      <option value="dia2">Día 2: Cadena Posterior y Tracción</option>
                      <option value="dia3">Día 3: Pierna Unilateral y Densidad</option>
                    </select>
                  </div>
                )}
              </div>

              {/* Protocolo Nutrición & Suplementos */}
              <div className="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider flex items-center justify-between">
                  <span>Hábitos & Suplementos</span>
                  <span className="text-xs text-emerald-400">1900 kcal | 150g Proteína</span>
                </h3>
                <div className="space-y-2">
                  <label className="flex items-center gap-3 p-2.5 bg-slate-900/60 rounded-lg cursor-pointer hover:bg-slate-900 border border-slate-700/50">
                    <input
                      type="checkbox"
                      checked={!!checks.ayuno}
                      onChange={() => handleCheck("ayuno")}
                      className="w-4 h-4 rounded text-emerald-500 accent-emerald-500"
                    />
                    <span className="text-sm text-slate-300">Ayuno 15h cumplido (Solo café negro + agua)</span>
                  </label>

                  <label className="flex items-center gap-3 p-2.5 bg-slate-900/60 rounded-lg cursor-pointer hover:bg-slate-900 border border-slate-700/50">
                    <input
                      type="checkbox"
                      checked={!!checks.creatina}
                      onChange={() => handleCheck("creatina")}
                      className="w-4 h-4 rounded text-emerald-500 accent-emerald-500"
                    />
                    <span className="text-sm text-slate-300">5g Creatina ({tipoDia === 'fuerza' ? 'Con batido' : 'Con almuerzo'})</span>
                  </label>

                  {tipoDia === "fuerza" && (
                    <label className="flex items-center gap-3 p-2.5 bg-slate-900/60 rounded-lg cursor-pointer hover:bg-slate-900 border border-slate-700/50">
                      <input
                        type="checkbox"
                        checked={!!checks.proteina}
                        onChange={() => handleCheck("proteina")}
                        className="w-4 h-4 rounded text-emerald-500 accent-emerald-500"
                      />
                      <span className="text-sm text-slate-300">1 scoop Proteína (24g) post-entreno</span>
                    </label>
                  )}

                  {tipoDia === "futbol" && (
                    <label className="flex items-center gap-3 p-2.5 bg-slate-900/60 rounded-lg cursor-pointer hover:bg-slate-900 border border-slate-700/50">
                      <input
                        type="checkbox"
                        checked={!!checks.futbol_match}
                        onChange={() => handleCheck("futbol_match")}
                        className="w-4 h-4 rounded text-emerald-500 accent-emerald-500"
                      />
                      <span className="text-sm text-slate-300">Partido de Fútbol jugado + Buena hidratación</span>
                    </label>
                  )}
                </div>
              </div>

              {/* Lista de Ejercicios (Solo para Fuerza) */}
              {tipoDia === "fuerza" && (
                <div className="space-y-3">
                  <h3 className="text-sm font-bold text-slate-200 uppercase tracking-wider">
                    Ejercicios • {rutinasData[rutinaFuerza].nombre}
                  </h3>
                  {rutinasData[rutinaFuerza].ejercicios.map((ej) => (
                    <div key={ej.id} className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-3">
                      <div className="flex justify-between items-start">
                        <div>
                          <h4 className="font-bold text-slate-100">{ej.nombre}</h4>
                          <p className="text-xs text-emerald-400 font-mono mt-0.5">Sugerido: {ej.peso} • {ej.series} series × {ej.reps}</p>
                        </div>
                        <button
                          onClick={() => toggleDetalle(ej.id)}
                          className="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-300 transition"
                        >
                          {detallesAbiertos[ej.id] ? "Ocultar guía ▲" : "Ver técnica ▼"}
                        </button>
                      </div>

                      {/* Guía Desplegable con Imagen */}
                      {detallesAbiertos[ej.id] && (
                        <div className="bg-slate-900/90 rounded-lg p-3 border border-slate-700 space-y-2 text-xs">
                          <img src={ej.img} alt={ej.nombre} className="w-full h-36 object-cover rounded-md mb-2 border border-slate-800" />
                          <p><strong className="text-emerald-400">Técnica:</strong> {ej.guia}</p>
                          <p><strong className="text-emerald-400">Beneficio:</strong> {ej.benef}</p>
                        </div>
                      )}

                      {/* Inputs de Series y Repeticiones Logradas */}
                      <div className="grid grid-cols-2 gap-2 pt-1 border-t border-slate-700/60">
                        <div>
                          <label className="text-[11px] text-slate-400 block mb-1">Series Logradas</label>
                          <input
                            type="number"
                            placeholder={ej.series}
                            value={ejerciciosProg[ej.id]?.series || ""}
                            onChange={(e) => handleProgresoChange(ej.id, "series", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-center text-slate-200 focus:border-emerald-500 focus:outline-none"
                          />
                        </div>
                        <div>
                          <label className="text-[11px] text-slate-400 block mb-1">Reps Logradas</label>
                          <input
                            type="text"
                            placeholder={ej.reps}
                            value={ejerciciosProg[ej.id]?.reps || ""}
                            onChange={(e) => handleProgresoChange(ej.id, "reps", e.target.value)}
                            className="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm text-center text-slate-200 focus:border-emerald-500 focus:outline-none"
                          />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* Botón Guardar Universal */}
              <button
                onClick={handleGuardar}
                className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3.5 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-base"
              >
                💾 Guardar Registro del Día ({formatearFecha(fecha)})
              </button>

              {mensajeGuardado && (
                <div className="p-3 bg-emerald-500/20 border border-emerald-500 rounded-xl text-center text-emerald-300 text-sm font-bold">
                  ✓ ¡Día guardado exitosamente en el historial!
                </div>
              )}
            </div>
          )}

          {/* --- TAB HISTORIAL --- */}
          {activeTab === "historial" && (
            <div className="space-y-4">
              {/* Filtros */}
              <div className="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex flex-wrap gap-2 items-center justify-between">
                <div className="flex items-center gap-2">
                  <span className="text-xs text-slate-400 font-semibold">Filtrar:</span>
                  <select
                    value={filtroTipo}
                    onChange={(e) => setFiltroTipo(e.target.value)}
                    className="bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1 text-xs text-slate-200 focus:outline-none"
                  >
                    <option value="todos">Todos los tipos</option>
                    <option value="fuerza">Fuerza</option>
                    <option value="futbol">Fútbol</option>
                    <option value="descanso">Descanso</option>
                  </select>
                </div>
                <input
                  type="date"
                  value={filtroFecha}
                  onChange={(e) => setFiltroFecha(e.target.value)}
                  className="bg-slate-900 border border-slate-700 rounded-lg px-2 py-1 text-xs text-emerald-400 focus:outline-none"
                />
                {filtroFecha && (
                  <button onClick={() => setFiltroFecha("")} className="text-xs text-slate-400 hover:text-white underline">
                    Limpiar fecha
                  </button>
                )}
              </div>

              {historialFiltrado.length === 0 ? (
                <div className="bg-slate-800/50 border border-slate-700 rounded-xl p-8 text-center text-slate-400">
                  <p>No hay registros guardados con esos filtros.</p>
                </div>
              ) : (
                historialFiltrado.map((h) => (
                  <div key={h.id} className="bg-slate-800 border border-slate-700 rounded-xl p-4 space-y-2">
                    <div className="flex justify-between items-start">
                      <div className="flex items-center gap-2">
                        <IconTrophy />
                        <div>
                          <span className="text-xs font-mono text-emerald-400 font-bold block">{h.fechaFormateada}</span>
                          <h4 className="font-bold text-slate-100 capitalize">
                            {h.tipoDia === 'fuerza' ? rutinasData[h.rutinaFuerza]?.nombre : `Día de ${h.tipoDia}`}
                          </h4>
                        </div>
                      </div>
                      <button
                        onClick={() => eliminarRegistro(h.id)}
                        className="text-slate-500 hover:text-rose-400 p-1 transition"
                        title="Eliminar registro"
                      >
                        <IconTrash />
                      </button>
                    </div>

                    {/* Resumen de hábitos */}
                    <div className="flex flex-wrap gap-1.5 pt-1">
                      {h.checks?.ayuno && <span className="text-[10px] bg-slate-900 border border-slate-700 text-slate-300 px-2 py-0.5 rounded">Ayuno 15h ✓</span>}
                      {h.checks?.creatina && <span className="text-[10px] bg-slate-900 border border-slate-700 text-emerald-400 px-2 py-0.5 rounded">Creatina 5g ✓</span>}
                      {h.checks?.proteina && <span className="text-[10px] bg-slate-900 border border-slate-700 text-emerald-400 px-2 py-0.5 rounded">Proteína 24g ✓</span>}
                      {h.checks?.futbol_match && <span className="text-[10px] bg-slate-900 border border-slate-700 text-amber-400 px-2 py-0.5 rounded">Partido jugado ✓</span>}
                    </div>

                    {/* Series y Reps guardadas */}
                    {h.tipoDia === "fuerza" && h.ejerciciosProg && (
                      <div className="pt-2 border-t border-slate-700/60 grid grid-cols-2 gap-1 text-[11px] text-slate-400">
                        {Object.entries(h.ejerciciosProg).map(([id, val]) => (
                          <div key={id} className="truncate">
                            • <span className="text-slate-300 font-medium">{val.series || 0}s × {val.reps || 0}r</span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                ))
              )}
            </div>
          )}

          {/* --- TAB GUÍA --- */}
          {activeTab === "guia" && (
            <div className="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-6 text-sm text-slate-300">
              <section>
                <h3 className="font-bold text-emerald-400 uppercase text-xs tracking-wider mb-2">Metas & Nutrición</h3>
                <ul className="list-disc list-inside space-y-1 text-xs">
                  <li><strong>Calorías:</strong> 1900 – 1950 kcal (Déficit ligero del 15%).</li>
                  <li><strong>Proteína diaria:</strong> 145 – 150 g.</li>
                  <li><strong>Grasas / Carbos:</strong> 60g grasas / 190g carbohidratos.</li>
                  <li><strong>Horario:</strong> Ayuno nocturno hasta las 12:00 PM (almuerzo 2:00 PM / cena 9:00 PM).</li>
                </ul>
              </section>

              <section className="border-t border-slate-700 pt-4">
                <h3 className="font-bold text-emerald-400 uppercase text-xs tracking-wider mb-2">Suplementación</h3>
                <ul className="list-disc list-inside space-y-1 text-xs">
                  <li><strong>Creatina:</strong> 5g todos los días sin excepción (con batido en entreno, con almuerzo en descanso).</li>
                  <li><strong>Proteína:</strong> 1 scoop (24g) al romper el ayuno tras la sesión de fuerza.</li>
                </ul>
              </section>

              <section className="border-t border-slate-700 pt-4">
                <h3 className="font-bold text-emerald-400 uppercase text-xs tracking-wider mb-2">Configuración de Mancuernas</h3>
                <ul className="list-disc list-inside space-y-1 text-xs">
                  <li><strong>Pesada (15.5 kg):</strong> Barra (1.5 kg) + 5kg + 5kg + 2kg + 2kg en una sola pesa.</li>
                  <li><strong>Media (11.5 kg c/u):</strong> Barra + 5kg por lado en 2 mancuernas.</li>
                  <li><strong>Ligera (5.5 kg c/u):</strong> Barra + 2kg por lado en 2 mancuernas.</li>
                </ul>
              </section>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
